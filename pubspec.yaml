name: jan_sarthi
description: "Jan Sarthi - Emergency Response Application V2"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Connectivity
  connectivity_plus: ^5.0.2

  # Firebase (Online Transport)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19

  # Offline Transport (P2P Nearby Connections)
  nearby_connections: ^4.2.0

  # OpenStreetMap & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  http: ^1.2.0

  # Sensors for Accident Detection
  sensors_plus: ^5.0.0

  # URL & SMS Launcher
  url_launcher: ^6.2.5

  # Utilities & Local Persistence
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audio/
